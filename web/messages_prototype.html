<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>UniConnect — Messages</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000000;
    --surface: #121212;
    --surface-elevated: #1c1c1e;
    --surface-light: #2c2c2e;
    --text: #ffffff;
    --text-secondary: #8e8e93;
    --text-tertiary: #636366;
    --primary: #6366f1;
    --primary-light: #818cf8;
    --secondary: #ec4899;
    --success: #34c759;
    --danger: #ff3b30;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    height: 100%;
    overscroll-behavior: none;
  }

  /* ── Phone shell ── */
  .shell {
    max-width: 430px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  /* ── Status bar ── */
  .status-bar {
    height: 44px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    flex-shrink: 0;
    position: relative;
    z-index: 100;
  }
  .status-bar .time {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .status-bar .indicators {
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 5px;
    letter-spacing: 0.2px;
  }

  /* ── App header ── */
  .app-header {
    height: 44px;
    background: var(--bg);
    border-bottom: 0.5px solid var(--surface-light);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    flex-shrink: 0;
    position: relative;
    z-index: 100;
  }
  .app-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.6px;
    background: linear-gradient(135deg, #6366f1, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .new-msg-btn {
    width: 34px;
    height: 34px;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    transition: background 0.15s;
    font-size: 20px;
  }
  .new-msg-btn:active { background: var(--surface-elevated); }

  /* ── Search bar ── */
  .search-wrapper {
    padding: 10px 14px;
    background: var(--bg);
    border-bottom: 0.5px solid var(--surface-light);
    position: sticky;
    top: 0;
    z-index: 98;
    flex-shrink: 0;
  }
  .search-bar {
    background: var(--surface-elevated);
    border: 1px solid var(--surface-light);
    border-radius: 12px;
    padding: 9px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color 0.2s;
  }
  .search-bar.focused { border-color: var(--primary); }
  .search-icon { font-size: 15px; flex-shrink: 0; opacity: 0.7; }
  .search-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    -webkit-font-smoothing: antialiased;
  }
  .search-input::placeholder { color: var(--text-tertiary); }
  .search-clear {
    background: var(--surface-light);
    border: none;
    border-radius: 50%;
    width: 18px;
    height: 18px;
    color: var(--text-secondary);
    font-size: 11px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }
  .search-clear.visible { display: flex; }

  /* ── Scroll body ── */
  .body {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    position: relative;
  }

  /* ── Pull-to-refresh indicator ── */
  .ptr-indicator {
    height: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: height 0.25s;
    background: var(--bg);
  }
  .ptr-indicator.active { height: 56px; }
  .ptr-spinner {
    width: 22px;
    height: 22px;
    border: 2.5px solid var(--surface-light);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Message list ── */
  .message-list { position: relative; }

  /* ── Row wrapper (for swipe) ── */
  .row-wrapper {
    position: relative;
    overflow: hidden;
  }
  .swipe-actions {
    position: absolute;
    right: 0;
    top: 0;
    height: 100%;
    display: flex;
    transform: translateX(100%);
    transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    z-index: 1;
  }
  .swipe-actions.revealed { transform: translateX(0); }
  .swipe-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    width: 80px;
    border: none;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    padding: 12px 0;
  }
  .swipe-btn .swipe-icon { font-size: 20px; }
  .swipe-btn.mute { background: var(--text-secondary); }
  .swipe-btn.delete { background: var(--danger); }

  /* ── Message row ── */
  .msg-row {
    padding: 12px 16px;
    border-bottom: 0.5px solid var(--surface-light);
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    background: var(--bg);
    position: relative;
    z-index: 2;
    transition: background 0.12s, transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    user-select: none;
    -webkit-user-select: none;
  }
  .msg-row:active { background: var(--surface-elevated); }
  .msg-row.swiped { transform: translateX(-160px); }

  /* ── Avatar ── */
  .avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #ec4899);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
    position: relative;
  }
  .online-dot {
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 13px;
    height: 13px;
    background: var(--success);
    border: 2.5px solid var(--bg);
    border-radius: 50%;
  }

  /* ── Content ── */
  .msg-content { flex: 1; min-width: 0; }
  .msg-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .msg-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.2px;
  }
  .msg-time {
    font-size: 12px;
    color: var(--text-tertiary);
    flex-shrink: 0;
    margin-left: 6px;
  }
  .msg-bottom {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .msg-preview {
    font-size: 14px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }
  .unread-badge {
    background: var(--primary);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    flex-shrink: 0;
    min-width: 20px;
    text-align: center;
  }

  /* ── Empty state ── */
  .empty-state {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 32px;
    text-align: center;
    gap: 10px;
  }
  .empty-state.visible { display: flex; }
  .empty-icon { font-size: 48px; margin-bottom: 6px; }
  .empty-title { font-size: 18px; font-weight: 600; color: var(--text); }
  .empty-sub { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }

  /* ── Bottom nav ── */
  .bottom-nav {
    height: 84px;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid var(--surface-light);
    display: flex;
    align-items: flex-start;
    justify-content: space-around;
    padding-top: 8px;
    flex-shrink: 0;
    position: relative;
    z-index: 100;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    padding: 0 10px;
    touch-action: manipulation;
    transition: transform 0.12s;
  }
  .nav-item:active { transform: scale(0.9); }
  .nav-icon { font-size: 22px; line-height: 1; }
  .nav-label {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 0.1px;
  }
  .nav-item.active .nav-label { color: var(--text); }
  .nav-item.active .nav-icon { filter: brightness(1.15); }

  /* Create button in nav */
  .nav-create {
    margin-top: -20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.12s;
  }
  .nav-create:active { transform: scale(0.9); }
  .create-circle {
    width: 48px;
    height: 48px;
    background: var(--primary);
    border: 4px solid var(--bg);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 24px;
    font-weight: 300;
    box-shadow: 0 4px 16px rgba(99, 102, 241, 0.5);
    line-height: 1;
  }
  .nav-create .nav-label { font-size: 10px; font-weight: 500; color: var(--text-secondary); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30, 30, 32, 0.96);
    border: 0.5px solid var(--surface-light);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 22px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    opacity: 0;
    transition: opacity 0.22s, transform 0.22s;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Highlight search match */
  mark {
    background: rgba(99, 102, 241, 0.35);
    color: var(--text);
    border-radius: 2px;
    padding: 0 1px;
  }
</style>
</head>
<body>

<div class="shell">
  <!-- Status bar -->
  <div class="status-bar">
    <span class="time" id="statusTime">9:41</span>
    <span class="indicators">📶&thinsp;5G &nbsp; 🔋</span>
  </div>

  <!-- App header -->
  <div class="app-header">
    <span class="app-title">UniConnect</span>
    <button class="new-msg-btn" id="newMsgBtn" aria-label="New message">✏️</button>
  </div>

  <!-- Search bar -->
  <div class="search-wrapper">
    <div class="search-bar" id="searchBar">
      <span class="search-icon">🔍</span>
      <input
        class="search-input"
        id="searchInput"
        type="search"
        placeholder="Search messages..."
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      />
      <button class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
    </div>
  </div>

  <!-- Scrollable body -->
  <div class="body" id="scrollBody">
    <!-- Pull-to-refresh -->
    <div class="ptr-indicator" id="ptrIndicator">
      <div class="ptr-spinner"></div>
    </div>

    <!-- Message list -->
    <div class="message-list" id="messageList"></div>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <span class="empty-icon">💬</span>
      <p class="empty-title">No messages yet</p>
      <p class="empty-sub">Start a conversation with someone from an event</p>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <div class="nav-item" onclick="showToast('Home')">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </div>
    <div class="nav-item" onclick="showToast('This Week')">
      <span class="nav-icon">📅</span>
      <span class="nav-label">This Week</span>
    </div>
    <div class="nav-create" onclick="showToast('Create event')">
      <div class="create-circle">+</div>
      <span class="nav-label">Create</span>
    </div>
    <div class="nav-item active" onclick="showToast('Messages')">
      <span class="nav-icon">💬</span>
      <span class="nav-label">Messages</span>
    </div>
    <div class="nav-item" onclick="showToast('Profile')">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Profile</span>
    </div>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────────
const MESSAGES = [
  { id: 1, name: "CS Society Group",  avatar: "💻", preview: "Hackathon registration is now open! 🚀", time: "2m",  unread: 3, online: true  },
  { id: 2, name: "Alex Chen",         avatar: "AC", preview: "Are you coming to the workshop tomorrow?",  time: "1h",  unread: 1, online: true  },
  { id: 3, name: "Music Club",        avatar: "🎵", preview: "Sound check at 6 PM tomorrow",              time: "3h",  unread: 0, online: false },
  { id: 4, name: "Maya Johnson",      avatar: "MJ", preview: "I'll bring my camera to the event!",        time: "5h",  unread: 0, online: true  },
  { id: 5, name: "Career Fair Team",  avatar: "🚀", preview: "Google confirmed their booth setup",        time: "1d",  unread: 2, online: false },
];

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Status bar clock ──────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const h = now.getHours().toString().padStart(2, '0');
  const m = now.getMinutes().toString().padStart(2, '0');
  document.getElementById('statusTime').textContent = `${h}:${m}`;
}
updateClock();
setInterval(updateClock, 15000);

// ── Swipe logic ───────────────────────────────────────────────────────────────
let currentSwipedRow = null;

function closeSwipe() {
  if (currentSwipedRow) {
    currentSwipedRow.msgRow.classList.remove('swiped');
    currentSwipedRow.actions.classList.remove('revealed');
    currentSwipedRow = null;
  }
}

function attachSwipe(wrapper, msgRow, actions) {
  let startX = 0, startY = 0, dx = 0, tracking = false;
  const THRESHOLD = 60;

  function onStart(e) {
    const touch = e.touches ? e.touches[0] : e;
    startX = touch.clientX;
    startY = touch.clientY;
    dx = 0;
    tracking = true;
  }

  function onMove(e) {
    if (!tracking) return;
    const touch = e.touches ? e.touches[0] : e;
    dx = touch.clientX - startX;
    const dy = touch.clientY - startY;

    // If more vertical than horizontal, cancel horizontal tracking
    if (Math.abs(dy) > Math.abs(dx) + 8) { tracking = false; return; }

    if (dx < 0) e.preventDefault();
  }

  function onEnd() {
    if (!tracking) return;
    tracking = false;
    if (dx < -THRESHOLD) {
      // close any other open row first
      if (currentSwipedRow && currentSwipedRow.msgRow !== msgRow) closeSwipe();
      msgRow.classList.add('swiped');
      actions.classList.add('revealed');
      currentSwipedRow = { msgRow, actions };
    } else if (dx > 20 && currentSwipedRow && currentSwipedRow.msgRow === msgRow) {
      closeSwipe();
    }
  }

  wrapper.addEventListener('touchstart', onStart, { passive: true });
  wrapper.addEventListener('touchmove', onMove, { passive: false });
  wrapper.addEventListener('touchend', onEnd, { passive: true });
}

// ── Highlight search term ─────────────────────────────────────────────────────
function highlight(text, query) {
  if (!query) return escHtml(text);
  const re = new RegExp(`(${escRe(query)})`, 'gi');
  return escHtml(text).replace(re, '<mark>$1</mark>');
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escRe(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(query = '') {
  const q = query.trim().toLowerCase();
  const list = MESSAGES.filter(m =>
    !q ||
    m.name.toLowerCase().includes(q) ||
    m.preview.toLowerCase().includes(q)
  );

  const container = document.getElementById('messageList');
  const emptyState = document.getElementById('emptyState');
  container.innerHTML = '';
  closeSwipe();

  if (list.length === 0) {
    emptyState.classList.add('visible');
    return;
  }
  emptyState.classList.remove('visible');

  list.forEach(msg => {
    // Wrapper (for swipe reveal)
    const wrapper = document.createElement('div');
    wrapper.className = 'row-wrapper';

    // Swipe actions
    const actions = document.createElement('div');
    actions.className = 'swipe-actions';
    actions.innerHTML = `
      <button class="swipe-btn mute" onclick="handleMute(${msg.id})">
        <span class="swipe-icon">🔕</span>Mute
      </button>
      <button class="swipe-btn delete" onclick="handleDelete(${msg.id})">
        <span class="swipe-icon">🗑</span>Delete
      </button>
    `;

    // Message row
    const row = document.createElement('div');
    row.className = 'msg-row';
    row.dataset.id = msg.id;

    const nameFrag = highlight(msg.name, query);
    const previewFrag = highlight(msg.preview, query);

    row.innerHTML = `
      <div class="avatar">
        ${escHtml(msg.avatar)}
        ${msg.online ? '<span class="online-dot"></span>' : ''}
      </div>
      <div class="msg-content">
        <div class="msg-top">
          <span class="msg-name">${nameFrag}</span>
          <span class="msg-time">${escHtml(msg.time)}</span>
        </div>
        <div class="msg-bottom">
          <span class="msg-preview">${previewFrag}</span>
          ${msg.unread > 0 ? `<span class="unread-badge">${msg.unread}</span>` : ''}
        </div>
      </div>
    `;

    row.addEventListener('click', () => {
      if (currentSwipedRow && currentSwipedRow.msgRow === row) { closeSwipe(); return; }
      closeSwipe();
      showToast(`Chat opened with ${msg.name}`);
    });

    // Close swipe when tapping elsewhere
    document.addEventListener('click', (e) => {
      if (!wrapper.contains(e.target)) closeSwipe();
    }, { once: false });

    wrapper.appendChild(actions);
    wrapper.appendChild(row);
    container.appendChild(wrapper);

    attachSwipe(wrapper, row, actions);
  });
}

function handleMute(id) {
  const msg = MESSAGES.find(m => m.id === id);
  if (msg) showToast(`${msg.name} muted`);
  closeSwipe();
}

function handleDelete(id) {
  const idx = MESSAGES.findIndex(m => m.id === id);
  if (idx !== -1) {
    const name = MESSAGES[idx].name;
    MESSAGES.splice(idx, 1);
    render(document.getElementById('searchInput').value);
    showToast(`Conversation with ${name} deleted`);
  }
}

// ── Search wiring ──────────────────────────────────────────────────────────────
const searchInput = document.getElementById('searchInput');
const searchBar = document.getElementById('searchBar');
const searchClear = document.getElementById('searchClear');

searchInput.addEventListener('focus', () => searchBar.classList.add('focused'));
searchInput.addEventListener('blur',  () => searchBar.classList.remove('focused'));
searchInput.addEventListener('input', () => {
  const q = searchInput.value;
  searchClear.classList.toggle('visible', q.length > 0);
  render(q);
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.classList.remove('visible');
  searchInput.focus();
  render('');
});

// ── New message button ────────────────────────────────────────────────────────
document.getElementById('newMsgBtn').addEventListener('click', () => {
  showToast('New message composer');
});

// ── Pull-to-refresh ───────────────────────────────────────────────────────────
const scrollBody = document.getElementById('scrollBody');
const ptrIndicator = document.getElementById('ptrIndicator');
let ptrStartY = 0, ptrActive = false, ptrLocked = false;

scrollBody.addEventListener('touchstart', (e) => {
  if (scrollBody.scrollTop === 0) {
    ptrStartY = e.touches[0].clientY;
    ptrActive = true;
  }
}, { passive: true });

scrollBody.addEventListener('touchmove', (e) => {
  if (!ptrActive || ptrLocked) return;
  const dy = e.touches[0].clientY - ptrStartY;
  if (dy > 60 && scrollBody.scrollTop === 0) {
    ptrLocked = true;
    ptrIndicator.classList.add('active');
  }
}, { passive: true });

scrollBody.addEventListener('touchend', () => {
  if (!ptrLocked) { ptrActive = false; return; }
  setTimeout(() => {
    ptrIndicator.classList.remove('active');
    ptrLocked = false;
    ptrActive = false;
    showToast('Messages refreshed');
    render(searchInput.value);
  }, 1100);
});

// ── Init ──────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
